<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Makes the website fit properly on a phone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our 1-Month Picnic Quiz 💕</title>

    <style>
        /* -------------------------
           PAGE BACKGROUND & ANIMATIONS
        ------------------------- */
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(
                135deg,
                #ffd6e7,
                #ffb6d5,
                #ffcce1
            );
            display: flex;
            justify-content: center;
            align-items: center;
            color: #8f1748;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating background hearts */
        .bg-heart {
            position: absolute;
            color: rgba(237, 79, 145, 0.25);
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            animation: floatUp 8s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.8) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* -------------------------
           QUIZ CARD
        ------------------------- */
        .quiz-container {
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(180, 40, 100, 0.25);
            text-align: center;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        /* -------------------------
           HEART & DECORATIONS
        ------------------------- */
        .heart {
            font-size: 48px;
            margin-bottom: 5px;
            animation: pulse 1.8s infinite alternate ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        /* -------------------------
           QUESTION NUMBER
        ------------------------- */
        .question-number {
            font-size: 15px;
            font-weight: 600;
            color: #d83b78;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        /* -------------------------
           PROGRESS BAR
        ------------------------- */
        .progress-background {
            width: 100%;
            height: 12px;
            background: #ffd3e3;
            border-radius: 20px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 20%;
            background: linear-gradient(90deg, #ed4f91, #ff7bb0);
            border-radius: 20px;
            transition: width 0.4s ease-in-out;
        }

        /* -------------------------
           QUESTION TEXT
        ------------------------- */
        h1 {
            font-size: 24px;
            color: #d92f72;
            margin-top: 0;
            margin-bottom: 10px;
            line-height: 1.35;
        }

        .subtitle {
            font-size: 15px;
            color: #a33a64;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* -------------------------
           TEXT INPUT FIELD
        ------------------------- */
        .input-container {
            margin-bottom: 15px;
            width: 100%;
        }

        .text-answer-input {
            width: 100%;
            padding: 16px 18px;
            border-radius: 18px;
            border: 2px solid #ff8fba;
            background: #fff0f6;
            color: #8f1748;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 4px rgba(237, 79, 145, 0.05);
        }

        .text-answer-input:focus {
            border-color: #ed4f91;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(237, 79, 145, 0.15);
        }

        .text-answer-input::placeholder {
            color: #d48ba8;
            font-style: italic;
        }

        /* -------------------------
           VALIDATION TOAST MESSAGE
        ------------------------- */
        .toast-message {
            display: none;
            background: #ffe3ed;
            color: #c71585;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 15px;
            border: 1px solid #ffb6d5;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6deg); }
            40%, 80% { transform: translateX(6deg); }
        }

        /* -------------------------
           NEXT BUTTON
        ------------------------- */
        #nextButton {
            margin-top: 15px;
            padding: 14px 45px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ed4f91, #d92f72);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(200, 40, 100, 0.3);
            transition: all 0.25s ease;
        }

        #nextButton:hover {
            background: linear-gradient(135deg, #d93678, #b81b58);
            transform: translateY(-2deg);
            box-shadow: 0 7px 20px rgba(200, 40, 100, 0.4);
        }

        /* -------------------------
           CELEBRATION SCREEN & CONFETTI
        ------------------------- */
        .final-heart {
            font-size: 65px;
            margin-bottom: 10px;
            animation: bounce 1.2s infinite alternate ease-in-out;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        .celebration-title {
            font-size: 25px;
            color: #d92f72;
            margin-bottom: 12px;
        }

        .final-message {
            font-size: 15px;
            line-height: 1.6;
            color: #8f1748;
            margin-bottom: 20px;
            background: #fff5f8;
            padding: 16px;
            border-radius: 18px;
            border: 1px dashed #ff8fba;
        }

        .menu-summary {
            text-align: left;
            background: #ffffff;
            padding: 18px 20px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(237, 79, 145, 0.1);
            border: 1px solid #ffe3ed;
        }

        .menu-summary h3 {
            margin-top: 0;
            color: #d92f72;
            font-size: 17px;
            margin-bottom: 12px;
            text-align: center;
            border-bottom: 1px dashed #ffd0e3;
            padding-bottom: 8px;
        }

        .summary-item {
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.4;
            color: #a33a64;
        }

        .summary-label {
            font-weight: bold;
            color: #d92f72;
            display: block;
            margin-bottom: 2px;
        }

        .summary-value {
            color: #5c1130;
            background: #fff0f6;
            padding: 6px 12px;
            border-radius: 10px;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            border-left: 3px solid #ff8fba;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: confettiFall 3s linear infinite;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* -------------------------
           RESPONSIVE STYLES
        ------------------------- */
        @media (max-width: 480px) {
            .quiz-container {
                padding: 25px 18px;
            }

            h1 {
                font-size: 21px;
            }

            .celebration-title {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <!-- Floating heart background elements -->
    <div id="bgHeartsContainer"></div>

    <div class="quiz-container">

        <div class="heart" id="headerHeart">🧺</div>

        <div class="question-number" id="questionNumber">
            Question 1 of 5
        </div>

        <div class="progress-background">
            <div class="progress" id="progress"></div>
        </div>

        <h1 id="question">
            What snacks or treats should we pack for our picnic? 🍓
        </h1>

        <p class="subtitle" id="subtitle">
            Sweet, savory, or something special you love!
        </p>

        <div class="input-container">
            <input type="text" id="answerInput" class="text-answer-input" placeholder="Type your idea here... 💕" autocomplete="off" />
        </div>

        <div class="toast-message" id="toast">
            Please type your answer first 💕
        </div>

        <button id="nextButton" onclick="nextQuestion()">
            Next →
        </button>

    </div>

    <script>
        /* -------------------------
           PICNIC QUESTIONS DATA
        ------------------------- */
        const questions = [
            {
                question: "What snacks or treats should we pack for our picnic? 🍓",
                subtitle: "Sweet, savory, or something special you love!",
                label: "🍓 Snacks & Treats",
                placeholder: "e.g. Strawberry sandwiches, chocolate strawberries..."
            },
            {
                question: "What drinks should we bring along? 🧃",
                subtitle: "Matcha, lemonade, avacado smoothie, or something bubbly?",
                label: "🧃 Refreshing Drinks",
                placeholder: "e.g. Peach iced tea, pink lemonade, boba..."
            },
            {
                question: "What fun activity or game should we bring? 🎲",
                subtitle: "Card games, a cozy book, music speaker, or painting?",
                label: "🎲 Picnic Activity",
                placeholder: "e.g. Mini painting kit, card games, listening to music..."
            },
            {
                question: "What special surprise or cozy item should we pack? 🧺",
                subtitle: "A fluffy blanket, polaroid camera, favorite dessert...",
                label: "🧺 Special Item",
                placeholder: "e.g. Cozy gingham blanket & polaroid camera..."
            },
            {
                question: "Are you free the Weekend of October 10th or October 24th? 🌸",
                subtitle: "I hope you are :)",
                label: "🌸 Are you free?",
                placeholder: "e.g. Yes, no..."
            }
        ];

        let currentQuestion = 0;
        let userAnswers = [];

        // Generate floating background elements
        function createBgHearts() {
            const container = document.getElementById("bgHeartsContainer");
            const heartIcons = ["💗", "💕", "🌸", "✨", "🍓", "🧺"];
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement("div");
                heart.className = "bg-heart";
                heart.textContent = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.animationDuration = (6 + Math.random() * 6) + "s";
                heart.style.animationDelay = (Math.random() * 5) + "s";
                heart.style.fontSize = (16 + Math.random() * 16) + "px";
                container.appendChild(heart);
            }
        }
        createBgHearts();

        /* -------------------------
           LOAD QUESTION
        ------------------------- */
        function loadQuestion() {
            const question = questions[currentQuestion];

            // Hide warning toast
            hideToast();

            document.getElementById("question").textContent = question.question;
            document.getElementById("subtitle").textContent = question.subtitle;
            document.getElementById("questionNumber").textContent =
                "Question " + (currentQuestion + 1) + " of " + questions.length;

            /* Update progress bar */
            const progressPercent = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById("progress").style.width = progressPercent + "%";

            /* Reset and focus input field */
            const inputField = document.getElementById("answerInput");
            inputField.value = "";
            inputField.placeholder = question.placeholder;
            inputField.focus();

            /* Update next button text */
            if (currentQuestion === questions.length - 1) {
                document.getElementById("nextButton").textContent = "Finish Picnic Plan! 💕";
            } else {
                document.getElementById("nextButton").textContent = "Next →";
            }
        }

        // Handle ENTER key on the input field
        document.getElementById("answerInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                nextQuestion();
            }
        });

        // Hide warning toast when typing
        document.getElementById("answerInput").addEventListener("input", function() {
            if (this.value.trim() !== "") {
                hideToast();
            }
        });

        function showToast() {
            const toast = document.getElementById("toast");
            toast.style.display = "block";
        }

        function hideToast() {
            const toast = document.getElementById("toast");
            toast.style.display = "none";
        }

        /* -------------------------
           NEXT QUESTION
        ------------------------- */
        function nextQuestion() {
            const inputField = document.getElementById("answerInput");
            const typedText = inputField.value.trim();

            /* Validate input */
            if (typedText === "") {
                showToast();
                inputField.focus();
                return;
            }

            /* Store answer */
            userAnswers.push({
                label: questions[currentQuestion].label,
                text: typedText
            });

            /* Check if this was the final question */
            if (currentQuestion === questions.length - 1) {
                showFinalScreen();
                return;
            }

            currentQuestion++;
            loadQuestion();
        }

        /* -------------------------
           FINAL CELEBRATION SCREEN
        ------------------------- */
        function showFinalScreen() {
            // Trigger celebration confetti
            createConfetti();

            const quizContainer = document.querySelector(".quiz-container");
            
            // Build summary list HTML
            let summaryHTML = "";
            userAnswers.forEach(function(item) {
                summaryHTML += `
                    <div class="summary-item">
                        <span class="summary-label">${item.label}</span>
                        <span class="summary-value">${escapeHtml(item.text)}</span>
                    </div>
                `;
            });

            quizContainer.innerHTML = `
                <div class="final-heart">🎉</div>

                <h1 class="celebration-title">
                    Our 1-Month Hangout Celebration 💕
                </h1>

                <div class="final-message">
                    Happy 1 Month Anniversary! 🥂<br>
                    I'm so happy I got to spend that day with you! 
                    I'm sorry if I can't be there with you all the time but I'm excited for our next date. 🌸✨
                </div>

                <div class="menu-summary">
                    <h3>🧺 Our Custom Picnic Plan:</h3>
                    ${summaryHTML}
                </div>

                <div style="font-size: 28px; margin-top: 15px;">
                    💗 💕 🥂 🎉 ✨ 🌸
                </div>
            `;
        }

        // Helper function to escape HTML string
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Confetti animation effect
        function createConfetti() {
            const colors = ["#ff4081", "#ff80ab", "#ffd54f", "#b388ff", "#80d8ff"];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement("div");
                confetti.className = "confetti";
                confetti.style.left = Math.random() * 100 + "vw";
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (2 + Math.random() * 3) + "s";
                confetti.style.animationDelay = (Math.random() * 2) + "s";
                document.body.appendChild(confetti);
            }
        }

        /* -------------------------
           START QUIZ
        ------------------------- */
        loadQuestion();
    </script>
</body>

</html>
